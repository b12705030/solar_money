name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─── Python 後端測試 ─────────────────────────────────────────────────────────
  # 涵蓋：
  #   - test_usable_fraction.py  → compute_usable_roof_fraction（陰影遮蔽 + 退縮）
  #   - test_optimal_tilt.py     → compute_optimal_tilt（六大目標仰角最佳化）
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run pytest
        run: pytest --cov=backend --cov-report=term-missing

  # ─── TypeScript 前端測試 ─────────────────────────────────────────────────────
  # 涵蓋：
  #   - compute.test.ts → computeResults（多目標月發電量、Faiman PR、收益計算）
  frontend-tests:
    name: Frontend (vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test
